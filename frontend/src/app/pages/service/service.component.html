<div class="services-container">
  <!-- Hero Section -->
  <section class="services-hero">
    <div class="container">
      <div class="hero-content">
        <h1>Our Services</h1>
        <p>Comprehensive healthcare data management solutions for modern medical practices</p>
      </div>
    </div>
  </section>

  <!-- Main Services Grid -->
  <section class="services-section">
    <div class="container">
      <div class="services-grid">
        <div class="service-card" *ngFor="let service of services">
          <div class="service-icon" [ngClass]="service.iconClass">
            <mat-icon>{{ service.icon }}</mat-icon>
          </div>
          <h3>{{ service.title }}</h3>
          <p class="service-description">{{ service.description }}</p>
          <ul class="feature-list">
            <li *ngFor="let feature of service.features">
              <mat-icon class="check-icon">check_circle</mat-icon>
              {{ feature }}
            </li>
          </ul>
        </div>
      </div>
    </div>
  </section>

  <!-- CTA Section -->
  <section class="services-cta">
    <div class="container">
      <div class="cta-content">
        <h2>Ready to Get Started?</h2>
        <p>Experience secure and efficient healthcare data management</p>
        <div class="cta-buttons">
          <button mat-raised-button color="accent" class="btn-primary">Request Demo</button>
          <button mat-stroked-button class="btn-secondary">Contact Us</button>
        </div>
      </div>
    </div>
  </section>
</div>
